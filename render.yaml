services:
  - type: web
    name: mossa
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: YOUR_USER_ID
        sync: false
    plan: free
    autoDeploy: true
    pythonVersion: 3.11.0
